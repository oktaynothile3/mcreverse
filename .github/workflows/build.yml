name: Build Windows DLL

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.3
        
      - name: Build
        run: msbuild mcreverse-proj.sln /p:Configuration=Release /p:Platform=x86
        
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: mcreverse-1.8.8
          path: mcreverse-inject/Release/*.dll
